<body>
<header class="top"><div class="brand">Lab 5S Audit Demo - Lab Version</div><div class="demo-label">Interactive demonstration</div></header>
<section class="intro"><div><h1 id="team-heading">Lab Shift A</h1><p class="subtitle">One team audit. Every assigned area.</p></div><div class="meta"><label>Lab team<select id="team-select"><option value="A">Lab Shift A</option><option value="B">Lab Shift B</option><option value="C">Lab Shift C</option><option value="D">Lab Shift D</option><option value="Day">Lab Day Shift</option></select></label><label>Audit frequency<select id="audit-frequency" required><option value="">Select frequency</option><option value="Weekly">Weekly</option><option value="Monthly">Monthly</option></select></label><label>Audit date<input id="audit-date" type="date"></label><label>Auditor<input id="auditor" placeholder="Enter auditor name" autocomplete="off"></label></div></section>
<div class="toolbar"><button id="example">Load example</button><button id="reset" class="quiet">Start over</button><button id="install-app" class="primary" hidden>Install app</button><span class="notice" id="save-status">Your audit is saved on this device. Export a copy to share or back up.</span></div>
<nav class="tabs" role="tablist" aria-label="Audit sections" id="tabs"></nav>
<div class="traffic-guide"><span>Area completion</span><span class="traffic red"><span class="traffic-light" aria-hidden="true"><i></i><i></i><i></i></span><span class="traffic-text">Not started</span></span><span class="traffic amber"><span class="traffic-light" aria-hidden="true"><i></i><i></i><i></i></span><span class="traffic-text">In progress</span></span><span class="traffic green"><span class="traffic-light" aria-hidden="true"><i></i><i></i><i></i></span><span class="traffic-text">Ratings complete</span></span><span>Green shows completion, not compliance.</span></div>
<main id="audit-panel" class="main" role="tabpanel"></main>
<section id="review-panel" class="review hidden" role="tabpanel"></section>
<div class="global-progress"><span id="progress-label"></span><progress id="progress" max="58" value="0" aria-label="Audit completion"></progress></div>
<div id="toast" class="toast hidden" role="status"></div>
<script id="saved-state" type="application/json">null</script>
<script>
'use strict';
const labTeams={
 A:{name:'Lab Shift A',areas:['Lab cage','Lab entrance and 5S red tag area','Around lab building']},
B:{name:'Lab Shift B',areas:['Lab consumable storage and back of storage area','slag table, silica sand buckets storage']},
 C:{name:'Lab Shift C',areas:['Fire Assay area','Sample prep 1','Flux room including back of containers','Crushed Alloy balance and Sieve Shaker']},
 D:{name:'Lab Shift D',areas:['Sample prep 2','Instrument lab including the back of containers']},
Day:{name:'Lab Day Shift',areas:['Lab floors','Office containers','Kitchen, and Toilets including back of containers, Table outside Lulama’s office and wash-bay']}
};
let teamKey='A',areas=labTeams[teamKey].areas;
const sections=[
 {name:'Sort',title:'Sort and Discard',questions:[
 ['Clutter','Storage areas, tables, shelves, floors and walkways are clear of clutter.'],
 ['Unnecessary items','Unnecessary items, tools, machines and equipment have been removed from the area.'],
 ['Signage & documents','The area is free of unnecessary signage, documents and notices.'],
 ['Spillages','The area is free of spillages.']]},
 {name:'Set in Order',title:'Set in Order',questions:[
 ['Marked locations','Designated areas are clearly marked and defined.'],
 ['Correct storage','Items are stored in their designated areas, including PPE, food, files and other relevant items.'],
 ['Access to equipment','Tools and equipment are easy to access and stored according to frequency of use, weight and size.'],
 ['Current information','Documents, signage, SDSs, files and notices are up to date and organised in a way that reduces search time.']]},
 {name:'Shine',title:'Shine',questions:[
 ['Leaks & damage','Areas, machines and equipment are free from leaks and visible damage.'],
 ['Waste management','Waste is sorted into the correct bins, and bins are not overflowing.'],
 ['Equipment condition','Machinery and equipment are in good working condition, with inspections and calibrations valid where required.'],
 ['Visible red tags','Items that cannot be resolved immediately are visually identified with red tags.']]},
 {name:'Standardise',title:'Standardise',questions:[
 ['Cleaning schedule','A specific cleaning schedule has been developed, assigned and posted.'],
 ['Visual standards','5S standards are posted and visible, including Min/Max levels, stacking standards and bin labels.'],
 ['Daily checks','Daily 5S audit cards are present and assigned for all areas.'],
 ['Red tag register','A valid red tag register is in place.']]},
 {name:'Sustain',title:'Sustain',questions:[
 ['Follow & review','5S standards are followed and reviewed by the team, including through 5S boards.'],
 ['Team training','At least 80% of the team is trained on 5S.'],
 ['Weekly self-audits','Weekly self-audits are completed, updated on 5S boards and used to drive improvement.'],
 ['Timely close-out','No items remain on the red tag register for more than two weeks.']]}
];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const fresh=()=>({teamKey,date:today(),frequency:'',auditor:'',ratings:{},comments:{},photos:{},coverage:[],complete:false});
let state;try{state=JSON.parse(localStorage.getItem('lab5s-audit-state')||'null')}catch(e){state=null}if(!state)state=JSON.parse($('saved-state').textContent)||fresh();if(state.teamKey&&labTeams[state.teamKey])teamKey=state.teamKey;state.teamKey=teamKey;areas=labTeams[teamKey].areas;let active=0,epoch=0,toastTimer;
const ref=(s,q)=>`${s+1}.${q+1}`,key=(s,a,q)=>`${s}-${a}-${q}`,block=(s,a)=>`${s}-${a}`;
function entries(s=null,a=null){const r=[];sections.forEach((sec,si)=>{if(s!==null&&s!==si)return;areas.forEach((area,ai)=>{if(a!==null&&a!==ai)return;sec.questions.forEach((q,qi)=>{if(si===4&&qi===1)return;r.push({s:si,a:ai,q:qi,k:key(si,ai,qi)})})})});if(a===null&&(s===null||s===4))r.push({s:4,a:'team',q:1,k:key(4,'team',1)});return r}
function stats(es){const vals=es.map(e=>state.ratings[e.k]),rated=vals.filter(v=>v!==undefined),app=rated.filter(v=>v!=='NA'),points=app.reduce((sum,v)=>sum+Number(v),0);return {rated:rated.length,total:es.length,na:rated.length-app.length,points,max:app.length*2,pct:app.length?Math.round(points/(app.length*2)*100):null}}
function traffic(st){const tone=st.rated===0?'red':st.rated<st.total?'amber':'green',label=st.rated===0?'Not started':st.rated<st.total?'In progress':'Ratings complete';return `<span class="traffic ${tone}" role="img" aria-label="${label}: ${st.rated} of ${st.total} ratings" title="${label}: ${st.rated} of ${st.total} ratings"><span class="traffic-light" aria-hidden="true"><i></i><i></i><i></i></span><span class="traffic-text">${label}</span></span>`}
function percent(st){return st.pct===null?'—':st.pct+'%'}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function changed(){
 state.complete=false;
 try{localStorage.setItem('lab5s-audit-state',JSON.stringify(state));const status=$('save-status');if(status)status.textContent='Saved on this device · Export a copy to share or back up.'}
 catch(e){const status=$('save-status');if(status)status.textContent='Device storage is full or unavailable. Export a copy to keep your audit.'}
 updateProgress()
 }
function tabs(){ $('tabs').innerHTML=sections.map((s,i)=>`<button id="tab-${i}" role="tab" aria-controls="audit-panel" aria-selected="${active===i}" tabindex="${active===i?0:-1}" data-tab="${i}">S${i+1} ${s.name}<span class="count" id="tab-count-${i}"></span></button>`).join('')+`<button id="tab-5" role="tab" aria-controls="review-panel" aria-selected="${active===5}" tabindex="${active===5?0:-1}" data-tab="5">Review</button>`; }
function ratingRow(s,a,q){const k=key(s,a,q);return `<div class="score-row"><div class="score-label" id="label-${k}"><strong>${ref(s,q)}</strong>${esc(sections[s].questions[q][1])}</div><div class="ratings" role="radiogroup" aria-labelledby="label-${k}" aria-label="${esc((a==='team'?'Team':areas[a])+' question '+ref(s,q))}">${['0','1','2','NA'].map(v=>`<label><input type="radio" name="rating-${k}" value="${v}" data-key="${k}" ${state.ratings[k]===v?'checked':''} aria-label="${esc((a==='team'?'Team':areas[a])+' '+ref(s,q)+' '+(v==='NA'?'Not applicable':v))}"><span>${v==='NA'?'N/A':v}</span></label>`).join('')}</div></div>`}
const chevron='<span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg></span>';
function photoMarkup(b,readonly=false){return (state.photos[b]||[]).map((p,i)=>`<figure class="photo"><img src="${esc(p.data)}" alt="${esc(p.name)}"><figcaption>${esc(p.name)}</figcaption>${readonly?'':`<button type="button" data-remove="${b}" data-index="${i}" aria-label="Remove ${esc(p.name)}">Remove</button>`}</figure>`).join('')}
function evidence(b,name){return `<div class="evidence"><label for="comment-${b}">Area comment / findings<textarea id="comment-${b}" data-comment="${b}" placeholder="Include the question number, finding and follow-up action.">${esc(state.comments[b]||'')}</textarea></label><div><label for="photos-${b}">Photos for ${esc(name)}</label><div class="upload-label"><input id="photos-${b}" type="file" accept="image/jpeg,image/png,image/webp" multiple data-photos="${b}" aria-label="Attach photos for ${esc(name)}"></div><div class="photo-help">JPG, PNG or WebP · Up to 4 photos, 5 MB each</div></div></div><div class="photos" id="gallery-${b}">${photoMarkup(b)}</div>`}
function areaBlock(s,a,team=false){const name=team?labTeams[teamKey].name+' — team training':areas[a],b=block(s,a);const qs=team?[1]:[0,1,2,3].filter(q=>!(s===4&&q===1));return `<details class="area" id="area-${b}"><summary>${chevron}<span>${esc(name)}</span><span class="area-progress" id="area-progress-${b}"></span></summary><div class="area-body">${qs.map(q=>ratingRow(s,a,q)).join('')}${evidence(b,team?'team training':name)}</div></details>`}
function render(){tabs();$('audit-panel').classList.toggle('hidden',active===5);$('review-panel').classList.toggle('hidden',active!==5);if(active===5){review();$('review-panel').setAttribute('aria-labelledby','tab-5')}else{const s=sections[active];$('audit-panel').setAttribute('aria-labelledby','tab-'+active);$('audit-panel').innerHTML=`<section aria-label="Area ratings"><div class="section-heading"><h2>S${active+1} — ${s.title}</h2><p class="muted">Rate each full question within its assigned area.</p><div class="inline-legend"><span><strong>2</strong> Fully meets standard</span><span><strong>1</strong> Partially meets standard</span><span><strong>0</strong> Does not meet standard</span><span><strong>N/A</strong> Not applicable in this area</span></div></div><div class="section-top"><span>${areas.length} assigned areas · separate ratings &amp; evidence</span><span id="section-progress"></span></div>${active===4?'<div class="team-note">Question 5.2 is assessed once for the whole team below. The other three questions are rated for each area.</div>':''}${areas.map((a,i)=>areaBlock(active,i)).join('')}${active===4?areaBlock(4,'team',true):''}<div class="bottom"><button data-back ${active===0?'disabled':''}>Previous section</button><button class="primary" data-next>${active===4?'Review audit':'Continue to S'+(active+2)}</button></div></section>`}updateProgress()}
function updateProgress(){const total=stats(entries());$('progress').max=total.total;$('progress').value=total.rated;$('progress-label').textContent=`${total.rated} of ${total.total} ratings complete · 1 team audit · ${areas.length} assigned areas`;sections.forEach((s,i)=>{const n=stats(entries(i));const el=$('tab-count-'+i);if(el)el.textContent=n.rated+'/'+n.total});if(active<5){const st=stats(entries(active));$('section-progress').textContent=`${st.rated} of ${st.total} rated`;[...areas.map((_,i)=>i),...(active===4?['team']:[])].forEach(a=>{const es=a==='team'?[{k:key(4,'team',1)}]:entries(active,a),t=stats(es);$('area-progress-'+block(active,a)).innerHTML=traffic(t)+`<span class="rating-count">${t.rated}/${t.total} · ${percent(t)}</span>`})}}
function navigate(n){active=n;render();window.scrollTo({top:0,behavior:'instant'})}
function review(){const st=stats(entries()),bad=entries().filter(e=>['0','1'].includes(state.ratings[e.k]));const records=Object.keys(state.comments).concat(Object.keys(state.photos));const bs=[...new Set(records)].filter(b=>(state.comments[b]||'').trim()||(state.photos[b]||[]).length);$('review-panel').innerHTML=`<h2>${esc(labTeams[teamKey].name)} — audit review</h2><p class="muted">${esc(state.frequency?state.frequency+' audit':'Frequency not selected')} · ${esc(state.date||'No audit date')} · ${esc(state.auditor||'Auditor not entered')}</p><div id="completion-message" class="${state.complete?'result':'hidden'}">Demo audit complete. Nothing has been submitted to Smartsheet. Download a copy to keep your audit and photos.</div><div class="review-grid"><div class="metric"><b>${percent(st)}</b><span>${state.complete?'Team score':'Provisional team score'} · ${st.points}/${st.max} applicable points</span></div><div class="metric"><b>${st.rated}<small> / ${st.total}</small></b><span>Ratings complete · ${st.na} N/A</span></div><div class="metric"><b>${bad.length}</b><span>Ratings below standard</span></div></div><div class="table-wrap"><table><thead><tr><th>Assigned area</th>${sections.map((s,i)=>`<th>S${i+1}</th>`).join('')}<th>Overall</th><th>Rated</th></tr></thead><tbody>${areas.map((a,i)=>{const t=stats(entries(null,i));return `<tr><td>${esc(a)}${traffic(t)}</td>${sections.map((s,j)=>`<td>${percent(stats(entries(j,i)))}</td>`).join('')}<td><strong>${percent(t)}</strong></td><td>${t.rated}/${t.total}</td></tr>`}).join('')}<tr><td>Team training (5.2, counted once)</td><td colspan="4">—</td><td>${state.ratings[key(4,'team',1)]===undefined?'Unrated':state.ratings[key(4,'team',1)]==='NA'?'N/A':state.ratings[key(4,'team',1)]+' / 2'}</td><td>—</td><td>${state.ratings[key(4,'team',1)]===undefined?'0':'1'}/1</td></tr><tr><th>Whole team</th>${sections.map((s,j)=>`<th>${percent(stats(entries(j)))}</th>`).join('')}<th>${percent(st)}</th><th>${st.rated}/${st.total}</th></tr></tbody></table></div><p class="footer-note">Score = points earned ÷ maximum points for rated, applicable questions. Unrated questions and N/A are excluded. Results remain provisional until every rating and area inspection is complete. Area scores exclude the shared training check; the team score includes it once.</p><section class="coverage"><h3>Confirm inspection coverage</h3><p class="muted">Tick only the areas actually inspected.</p>${areas.map((a,i)=>`<label><input type="checkbox" data-coverage="${i}" ${state.coverage.includes(i)?'checked':''}>${esc(a)}</label>`).join('')}</section><div class="review-actions"><button class="primary" id="complete">Complete demo audit</button><button id="download">Download this audit</button><button id="print">Print review</button><button data-tab="0">Back to ratings</button></div><h3>Ratings needing attention</h3>${bad.length?`<div class="table-wrap"><table><thead><tr><th>Area</th><th>Question</th><th>Rating</th><th>Check</th></tr></thead><tbody>${bad.map(e=>`<tr><td>${e.a==='team'?'Whole team':esc(areas[e.a])}</td><td>${ref(e.s,e.q)}</td><td>${state.ratings[e.k]}</td><td>${esc(sections[e.s].questions[e.q][0])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No ratings below standard recorded.</p>'}<h3>Comments &amp; photos</h3>${bs.length?bs.map(b=>{const [s,a]=b.split('-');return `<div class="finding"><h4>S${+s+1} · ${a==='team'?'Team training':esc(areas[+a])}</h4><p>${esc(state.comments[b]||'')}</p><div class="photos">${photoMarkup(b,true)}</div></div>`}).join(''):'<p class="empty">No comments or photos added yet.</p>'}<div class="print-detail"><h3>All ratings</h3>${sections.map((sec,s)=>`<h4>S${s+1} — ${sec.title}</h4><table><tbody>${entries(s).map(e=>`<tr><td>${e.a==='team'?'Whole team':esc(areas[e.a])}</td><td>${ref(s,e.q)} ${esc(sec.questions[e.q][1])}</td><td>${state.ratings[e.k]===undefined?'Unrated':state.ratings[e.k]==='NA'?'N/A':state.ratings[e.k]}</td></tr>`).join('')}</tbody></table>`).join('')}</div><p class="footer-note">Interactive concept only. Ratings, comments and images are held in this page, and are cleared when it is refreshed or closed unless you download a copy. No Smartsheet connection.</p>`}
async function addPhotos(input){const b=input.dataset.photos,files=[...input.files],atStart=epoch;state.photos[b]||=[];for(const f of files){if(state.photos[b].length>=4){toast('Maximum 4 photos per area block.');break}if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){toast('Choose a JPG, PNG or WebP image smaller than 5 MB.');continue}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=data});if(epoch!==atStart)return;state.photos[b].push({name:f.name,data});changed()}catch{toast('This image could not be read. Try another photo.')}}input.value='';const gallery=$('gallery-'+b);if(gallery)gallery.innerHTML=photoMarkup(b)}
function download(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=labTeams[teamKey].name.replace(/\s+/g,'_')+'_5S_'+(state.frequency||'Draft')+'_Audit_'+(state.date||'draft')+'.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded an interactive copy with your ratings, comments and photos.')}
function loadExample(){if((stats(entries()).rated||Object.keys(state.comments).length||Object.keys(state.photos).length)&&!confirm('Replace the current demo entries with example data?'))return;epoch++;state=fresh();state.auditor='Demo auditor';state.frequency='Weekly';entries().forEach(e=>state.ratings[e.k]='2');state.ratings[key(0,0,0)]='1';state.ratings[key(0,0,1)]='0';state.ratings[key(1,1,0)]='1';state.ratings[key(2,1,0)]='1';if(areas[2])state.ratings[key(0,2,3)]='NA';state.comments['0-0']='1.1: Example clutter was found in '+areas[0]+'.\n1.2: Remove unused items and mark the clear route.';if(areas[1])state.comments['1-1']='2.1: Storage markings need attention in '+areas[1]+'.';if(areas[1])state.comments['2-1']='3.1: Example defect in '+areas[1]+'. Tag and arrange repair.';if(areas[2])state.comments['0-2']='1.4: Not applicable in this dummy example.';state.coverage=areas.map((_,i)=>i);syncMeta();render();toast('Example loaded. All entries are fictional; edit any rating to explore.')}
function complete(){const st=stats(entries()),missing=[];if(!['Weekly','Monthly'].includes(state.frequency))missing.push('select Weekly or Monthly');if(!state.date)missing.push('enter an audit date');if(!state.auditor.trim())missing.push('enter the auditor name');if(st.rated<st.total)missing.push(`complete ${st.total-st.rated} remaining ratings`);if(state.coverage.length<areas.length)missing.push(`confirm all ${areas.length} area inspections`);if(missing.length){const el=$('completion-message');el.className='result error';el.textContent='Before completing the demo: '+missing.join('; ')+'.';el.scrollIntoView({behavior:'smooth',block:'center'});return}state.complete=true;review();$('completion-message').scrollIntoView({behavior:'smooth',block:'center'})}
function syncMeta(){$('team-select').value=teamKey;$('team-heading').textContent=labTeams[teamKey].name;$('audit-frequency').value=state.frequency||'';$('audit-date').value=state.date;$('auditor').value=state.auditor}
document.addEventListener('input',e=>{if(e.target.dataset.comment){state.comments[e.target.dataset.comment]=e.target.value;changed()}if(e.target.id==='auditor'){state.auditor=e.target.value;changed();if(active===5)review()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='team-select'){const next=el.value;if(next!==teamKey){const hasEntries=stats(entries()).rated||Object.keys(state.comments).length||Object.keys(state.photos).length;if(hasEntries&&!confirm('Changing the Lab team will clear the current ratings, comments and photos. Continue?')){el.value=teamKey;return}const meta={date:state.date,frequency:state.frequency,auditor:state.auditor};epoch++;teamKey=next;areas=labTeams[teamKey].areas;state=fresh();Object.assign(state,meta,{teamKey});active=0;syncMeta();changed();render();toast(labTeams[teamKey].name+' loaded with '+areas.length+' assigned areas.')}}if(el.id==='audit-frequency'){state.frequency=el.value;changed();if(active===5)review()}if(el.dataset.key){state.ratings[el.dataset.key]=el.value;changed()}if(el.dataset.photos)addPhotos(el);if(el.dataset.coverage!==undefined){const i=+el.dataset.coverage;state.coverage=el.checked?[...new Set([...state.coverage,i])]:state.coverage.filter(a=>a!==i);changed();const msg=$('completion-message');if(msg)msg.classList.add('hidden')}if(el.id==='audit-date'){state.date=el.value;changed();if(active===5)review()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab!==undefined)navigate(+el.dataset.tab);if(el.hasAttribute('data-next'))navigate(active+1);if(el.hasAttribute('data-back')&&active>0)navigate(active-1);if(el.dataset.remove){state.photos[el.dataset.remove].splice(+el.dataset.index,1);changed();$('gallery-'+el.dataset.remove).innerHTML=photoMarkup(el.dataset.remove)}if(el.id==='example')loadExample();if(el.id==='reset'&&confirm('Clear all ratings, comments and photos in this demo?')){epoch++;state=fresh();syncMeta();changed();navigate(0);toast('Ready for a new '+labTeams[teamKey].name+' audit.')}if(el.id==='complete')complete();if(el.id==='download')download();if(el.id==='print')window.print()});
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();navigate(e.key==='Home'?0:e.key==='End'?5:(active+(e.key==='ArrowRight'?1:5))%6);$('tab-'+active).focus()});
syncMeta();render();

// PWA installation and offline support.
let deferredInstallPrompt=null;
const installButton=$('install-app');
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();
 deferredInstallPrompt=event;
 if(installButton)installButton.hidden=false;
});
if(installButton){
 installButton.addEventListener('click',async()=>{
  if(!deferredInstallPrompt){toast('Use your browser menu and choose Install app or Add to Home screen.');return}
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  installButton.hidden=true;
 });
}
window.addEventListener('appinstalled',()=>{
 if(installButton)installButton.hidden=true;
 toast('Lab 5S Audit is installed.');
});
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./service-worker.js').catch(()=> {
   const status=$('save-status');
   if(status)status.textContent='Offline setup could not start. Check the hosting configuration.';
  });
 });
}

</script>
</body>
</html>
